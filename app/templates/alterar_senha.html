{% extends "base.html" %}

{% block title %}Alterar senha — PTBDSWS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0">Alterar senha</h2>
        </div>
        
        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.alterar_senha') }}" novalidate>
                    
                    <div class="mb-3">
                        <label for="senha_atual" class="form-label fw-semibold">Senha atual</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="senha_atual" 
                                   name="senha_atual" 
                                   placeholder="Digite sua senha atual"
                                   required
                                   autofocus>
                        </div>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label fw-semibold">Nova senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="nova_senha" 
                                   name="nova_senha" 
                                   placeholder="Mínimo 8 caracteres"
                                   minlength="8"
                                   required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirmacao" class="form-label fw-semibold">Confirmar nova senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="confirmacao" 
                                   name="confirmacao" 
                                   placeholder="Repita a nova senha"
                                   minlength="8"
                                   required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-2"></i>Salvar nova senha
                    </button>
                </form>
            </div>
        </div>
        
        <div class="alert alert-warning mt-4 mb-0 small">
            <i class="bi bi-shield-exclamation me-2"></i>
            Após alterar a senha, você receberá um e-mail de confirmação. Se não foi você, entre em contato com o suporte.
        </div>
    </div>
</div>
{% endblock %}
