{% extends "base.html" %}
{% block title %}Usuário {{ name }} — PTBDSWS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card text-center">
            <div class="card-body p-5">
                <span class="avatar avatar-xl bg-success mb-3">{{ (name[0] if name else '?')|upper }}</span>
                <h1 class="h2 mb-1">Hello, {{ name }}!</h1>
                <p class="text-muted">Bem-vindo(a) à página de usuário dinâmica.</p>
                <p class="mb-4">Acessada via <code>/user/{{ name }}</code></p>
                <a href="{{ url_for('main.home') }}" class="btn btn-primary"><i class="bi bi-house me-2"></i>Voltar para o início</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
