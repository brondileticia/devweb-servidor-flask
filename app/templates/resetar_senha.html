{% extends "base.html" %}

{% block title %}Redefinir senha — PTBDSWS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" 
                 style="width: 70px; height: 70px;">
                <i class="bi bi-shield-lock" style="font-size: 2rem;"></i>
            </div>
            <h2 class="fw-bold mb-1">Criar nova senha</h2>
            <p class="text-muted">Escolha uma senha forte para proteger sua conta.</p>
        </div>
        
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.resetar_senha', token=token) }}" novalidate>
                    
                    <div class="mb-3">
                        <label for="senha" class="form-label fw-semibold">Nova senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="senha" 
                                   name="senha" 
                                   placeholder="Mínimo 8 caracteres"
                                   minlength="8"
                                   required
                                   autofocus>
                            <button class="btn btn-outline-secondary" 
                                    type="button" 
                                    id="toggleSenha">
                                <i class="bi bi-eye" id="iconeOlho"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirmacao" class="form-label fw-semibold">Confirmar nova senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="confirmacao" 
                                   name="confirmacao" 
                                   placeholder="Repita a nova senha"
                                   minlength="8"
                                   required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-2"></i>Redefinir senha
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('toggleSenha').addEventListener('click', function() {
        const input = document.getElementById('senha');
        const icone = document.getElementById('iconeOlho');
        
        if (input.type === 'password') {
            input.type = 'text';
            icone.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icone.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
</script>
{% endblock %}
